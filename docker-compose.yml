name: job-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_tracker}
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5448}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER:-job_tracker}:${POSTGRES_PASSWORD:-job_tracker}@db:5432/${POSTGRES_DB:-job_tracker}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-development-secret-change-me-local-development-secret-change-me}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_URL_PORT: ${APP_PORT:-4408}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-4408}:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped

volumes:
  db-data:
